name: build

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify formatting
        run: dotnet format ContextWindow.AI.TruckInquiryBenchmark.slnx --verify-no-changes
      - name: Test
        run: dotnet test ContextWindow.AI.TruckInquiryBenchmark.slnx --configuration Release